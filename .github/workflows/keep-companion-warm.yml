# Render's free tier spins the service down after ~15 min of no traffic. A cold
# start makes companion, Q&A, and feedback silently fail until the host wakes.
name: Keep Buddy Walk API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          curl -fsS --max-time 30 "https://buddy-walk-api.onrender.com/api/health" || echo "Ping failed (service may still be deploying)"
