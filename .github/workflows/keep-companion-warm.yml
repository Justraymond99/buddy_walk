# Render's free tier spins the service down after ~15 min of no traffic. GitHub
# scheduled workflows are often delayed by hours, so the server also self-pings
# via RENDER_EXTERNAL_URL while awake (see mobile/server/utils/keepAlive.ts).
name: Keep Buddy Walk API warm

on:
  schedule:
    # GitHub may delay cron runs; server-side keepalive covers gaps once awake.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/server/**"
      - ".github/workflows/keep-companion-warm.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API (retry through cold start)
        run: |
          URL="https://buddy-walk-api.onrender.com/api/health"
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt..."
            if curl -fsS --max-time 90 "$URL"; then
              echo "API is warm."
              exit 0
            fi
            echo "Ping failed — waiting 20s (cold start can take ~60s)"
            sleep 20
          done
          echo "Failed to wake API after 5 attempts"
          exit 1
