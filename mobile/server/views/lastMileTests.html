<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Buddy Walk - Last Meters Localization</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #171a1f;
      --panel-2: #20242b;
      --line: #313844;
      --text: #f5f7fb;
      --muted: #a9b1be;
      --quiet: #737d8c;
      --blue: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: #171a1f;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.2rem; }
    button, a.button, select, input, textarea {
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }
    button, a.button {
      cursor: pointer;
      padding: 8px 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
    }
    button.primary, a.button.primary { background: var(--blue); border-color: var(--blue); }
    button.secondary { background: #2a3039; border-color: #3b4351; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    main { max-width: 1440px; margin: 0 auto; padding: 22px; }
    .toolbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 20px; }
    .field label { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 4px; }
    .field input, .field select { height: 36px; padding: 0 10px; }
    
    .status { margin: 12px 0 18px; color: var(--muted); font-size: 0.9rem; }
    .error { display: none; margin: 14px 0; padding: 12px 14px; border: 1px solid var(--red); background: #3a1618; border-radius: 6px; }
    .empty { padding: 28px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; color: var(--muted); text-align: center; }
    
    /* Table Styles */
    table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    thead { background: #1b1f25; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 700; white-space: nowrap; }
    tbody tr:hover { background: #1b1f25; }
    
    /* Phase Badges */
    .module-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
    .module-pass { background: #0d3d1e; color: #3fb950; }
    .module-fail { background: #3d1418; color: #f85149; }
    .module-skip { background: #3a2f0d; color: #d29922; }
    .module-na   { background: #21262d; color: #6e7681; }
    
    /* Review Status Pills */
    .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: #2a3039; color: var(--muted); font-size: 0.78rem; font-weight: 700; }
    .pill.pass { color: #dcfce7; background: #14532d; }
    .pill.partial { color: #fef3c7; background: #713f12; }
    .pill.fail { color: #fee2e2; background: #7f1d1d; }

    /* Modal Styles */
    #lmDetailOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; overflow-y: auto; padding: 20px; }
    .modal-content { max-width: 900px; margin: 20px auto; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 24px; position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .modal-header h2 { margin: 0; font-size: 1.4rem; }
    
    .test-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; font-size: 0.9rem; color: var(--muted); background: var(--panel); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line); }
    
    /* Phase Blocks */
    .module-block { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; background: var(--panel); }
    .module-block .module-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 12px; font-size: 1.05rem; }
    .module-metric { color: var(--muted); font-size: 0.9rem; margin: 4px 0; line-height: 1.4; }
    .module-metric b { color: var(--text); }
    
    /* Raw Prompts Accordion */
    .module-raw { margin-top: 12px; font-size: 0.85rem; }
    .module-raw summary { cursor: pointer; color: var(--blue); font-weight: 600; user-select: none; }
    .module-raw pre { white-space: pre-wrap; background: #0b0d10; padding: 12px; border-radius: 6px; margin-top: 8px; border: 1px solid var(--line); color: var(--muted); font-family: ui-monospace, SFMono-Regular, monospace; }
    
    /* Visuals Grid */
    .images-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .image-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0b0d10; }
    .image-label { padding: 8px 10px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); font-size: 0.82rem; background: var(--panel); }
    .image-wrap img { display: block; width: 100%; height: 200px; object-fit: contain; }

    /* Review Section */
    .review-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
    .review-section select { width: 100%; height: 38px; }
    .review-section textarea { width: 100%; min-height: 80px; padding: 10px; resize: vertical; }

    .small { color: var(--quiet); font-size: 0.78rem; }
    
    @media (max-width: 768px) {
      .review-section { grid-template-columns: 1fr; }
      .test-meta { flex-direction: column; gap: 8px; }
      th, td { padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Buddy Walk - Last Meters Localization Tests</h1>
      <div class="small">Review pipeline modules, confidence fusion, and evaluate visual alignment.</div>
    </div>
    <div class="toolbar" style="margin:0;">
      <button id="refresh">Refresh</button>
      <a class="button primary" id="download" href="#">Export CSV</a>
    </div>
  </header>
  
  <main>
    <div class="toolbar">
      <div class="field">
        <label for="limit">Limit</label>
        <input id="limit" type="number" min="1" max="500" value="50" />
      </div>
      <div class="field">
        <label for="statusFilter">Review Status</label>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="untested">Untested</option>
          <option value="pass">Pass</option>
          <option value="partial">Partial</option>
          <option value="fail">Fail</option>
        </select>
      </div>
      <div class="field">
        <label for="textFilter">Destination</label>
        <input id="textFilter" type="text" placeholder="e.g. CVS" />
      </div>
      <button class="primary" id="apply">Apply Filters</button>
    </div>
    
    <div class="status" id="status">Loading...</div>
    <div class="error" id="error"></div>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Destination</th>
            <th>Mode</th>
            <th>Review</th>
            <th>Mod B (User Image)</th>
            <th>Mod C (Destination)</th>
            <th>Mod D (Confidence)</th>
            <th>Mod E (Guidance)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="lmTestsList">
          <tr><td colspan="9" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Detail Modal Overlay -->
  <div id="lmDetailOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="lmDetailTitle">Test detail</h2>
          <div class="small" id="lmDetailSubtitle"></div>
        </div>
        <button class="secondary" id="lmDetailClose">Close</button>
      </div>
      
      <div id="lmDetailBody"></div>
    </div>
  </div>

  <script>
    var TOKEN = '__ADMIN_TOKEN__';
    var activeTests = [];

    function qs() {
      var params = new URLSearchParams();
      if (TOKEN && TOKEN !== '__ADMIN_TOKEN__') params.set('token', TOKEN);
      params.set('includeImages', 'true');
      params.set('limit', document.getElementById('limit').value || '50');
      return '?' + params.toString();
    }

    function authHeaders(extra) {
      var headers = extra || {};
      if (TOKEN && TOKEN !== '__ADMIN_TOKEN__') headers['x-admin-token'] = TOKEN;
      return headers;
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function idOf(row) { return row._id || row.id || ''; }

    function fmtDate(value) {
      if (!value) return '—';
      var date = new Date(value);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString();
    }

    function showError(message) {
      var el = document.getElementById('error');
      el.style.display = message ? 'block' : 'none';
      el.textContent = message || '';
    }

    // --- Module Logic ---
    function findStep(steps, name) {
      return (steps || []).find(function (s) { return s.name === name; });
    }

    function badge(status, label) {
      var cls = { pass: 'module-pass', fail: 'module-fail', skip: 'module-skip', na: 'module-na' }[status] || 'module-na';
      var text = { pass: '✅ PASS', fail: '❌ FAIL', skip: '⏭ SKIPPED', na: '— N/A' }[status] || status;
      return '<span class="module-badge ' + cls + '">' + esc(label || text) + '</span>';
    }

    function buildModules(test) {
      var steps = test.steps || [];
      var step0_proximity = findStep(steps, 'proximity_gate');
      var step0_headingAlignment = findStep(steps, 'heading_alignment');
      
      var modB_heading1 = findStep(steps, 'panorama_current_view_match');
      var modB_compassStep = findStep(steps, 'compass_current_heading');
      var modB_compSource = findStep(steps, 'heading_source_comparison');
      
      var modC_target = findStep(steps, 'target_store_match');
      var modC_reference = findStep(steps, 'destination_reference_match');
      
      var modD_confidence = findStep(steps, 'confidence_fusion');
      var modE_guidance = findStep(steps, 'accessible_guidance');

      var modBStatus = test.currentHeading !== undefined && test.currentHeading !== null ? 'pass' : 'fail';
      if (test.testScenario === 'destination_unverified') modBStatus = 'na';

      // Module C considers fallback logic internally
      var modCStatus = modC_target 
        ? (modC_target.success ? 'pass' : (modC_reference && modC_reference.success ? 'pass' : 'fail')) 
        : 'na';

      var modDStatus = modD_confidence ? (modD_confidence.success ? 'pass' : 'fail') : 'na';
      var modEStatus = modE_guidance ? (modE_guidance.success ? 'pass' : 'fail') : (test.turnInstruction ? 'pass' : 'na');

      return {
        step0: {
          status: step0_proximity ? 'pass' : 'na',
          title: 'Step 0 · Geometric Reasoning & Pre-check',
          metrics: [
            ['Approach Gate', step0_proximity ? step0_proximity.response : '—'],
            ['Heading Alignment', step0_headingAlignment ? step0_headingAlignment.response : '—']
          ],
          raw: [step0_proximity, step0_headingAlignment].filter(Boolean)
        },
        moduleB: {
          status: modBStatus,
          title: 'Module B · User Image Localization',
          metrics: [
            ['Panorama matched heading', test.panoramaMatchedHeading != null ? test.panoramaMatchedHeading + '°' : '—'],
            ['Phone compass', test.compassHeading != null ? test.compassHeading + '°' : '—'],
            ['Comparison difference', modB_compSource ? modB_compSource.response : '—'],
            ['Authoritative heading', test.currentHeading != null ? test.currentHeading + '°' : '—']
          ],
          raw: [modB_heading1, modB_compassStep, modB_compSource].filter(Boolean)
        },
        moduleC: {
          status: modCStatus,
          title: 'Module C · Destination Localization',
          metrics: [
            ['Panorama search', modC_target ? (modC_target.response || '—') : '—'],
            ['Fallback reference search', modC_reference ? (modC_reference.response || '—') : '—'],
            ['Resolved destination heading', test.targetHeading != null ? test.targetHeading + '°' : 'Not visible']
          ],
          raw: [modC_target, modC_reference].filter(Boolean)
        },
        moduleD: {
          status: modDStatus,
          title: 'Module D · Confidence Fusion',
          metrics: [
            ['GPS Accuracy', test.gpsAccuracyMeters != null ? Math.round(test.gpsAccuracyMeters) + ' m' : '—'],
            ['Confidence Score', test.confidenceScore != null ? Math.round(test.confidenceScore * 100) + '%' : '—'],
            ['Confidence Level', test.confidenceLevel ? test.confidenceLevel.toUpperCase() : '—'],
            ['Reasons', (test.confidenceReasons || []).join(' ') || 'None']
          ],
          raw: [modD_confidence].filter(Boolean)
        },
        moduleE: {
          status: modEStatus,
          title: 'Module E · Guidance Generation',
          metrics: [
            ['Calculated Turn', test.turnInstruction || '—'],
            ['Visual Landmarks', modE_guidance ? (modE_guidance.response || '—') : '—']
          ],
          raw: [modE_guidance].filter(Boolean)
        }
      };
    }

    function renderModuleBlock(moduleData) {
      var metricsHtml = moduleData.metrics.map(function (m) {
        return '<div class="module-metric"><b>' + esc(m[0]) + ':</b> ' + esc(m[1]) + '</div>';
      }).join('');
      
      var rawHtml = moduleData.raw.length ? (
        '<details class="module-raw"><summary>View AI step prompts & responses (' + moduleData.raw.length + ' calls)</summary>' +
        moduleData.raw.map(function (r) {
          var successTxt = r.success ? 'SUCCESS' : 'FAILED';
          return '<pre><b>[' + esc(r.name) + ']</b> (' + esc(r.model) + ') - ' + successTxt + '\n\n' +
            'PROMPT:\n' + esc(r.prompt || '—') + '\n\n' +
            'RESPONSE:\n' + esc(r.response || r.error || '—') + '</pre>';
        }).join('') +
        '</details>'
      ) : '';
      
      return (
        '<div class="module-block">' +
          '<div class="module-head"><span>' + esc(moduleData.title) + '</span>' + badge(moduleData.status) + '</div>' +
          metricsHtml + rawHtml +
        '</div>'
      );
    }

    // --- Detail Modal Render ---
    function openDetail(index) {
      var test = activeTests[index];
      if (!test) return;
      
      var modules = buildModules(test);
      var coords = [test.lat, test.lng].filter(function(v) { return v !== undefined; }).join(', ');
      
      document.getElementById('lmDetailTitle').textContent = test.destinationPlaceName || test.destination || 'Unknown Destination';
      document.getElementById('lmDetailSubtitle').textContent = fmtDate(test.serverTs || test.createdAt) + ' | ' + coords;
      
      var imagesHtml = '<div class="images-grid">' +
        '<div class="image-wrap"><div class="image-label">I1. User Photo</div>' +
        (test.userPhoto ? '<img src="' + esc(test.userPhoto) + '" alt="User photo" />' : '<div class="empty">No photo</div>') +
        '</div>' +
        '<div class="image-wrap"><div class="image-label">I3. Panorama (' + esc(test.panoramaDate || 'N/A') + ')</div>' +
        (test.panoramaPhoto ? '<img src="' + esc(test.panoramaPhoto) + '" alt="Panorama" />' : '<div class="empty">No panorama</div>') +
        '</div>' +
        (test.destinationPhoto ? 
          '<div class="image-wrap"><div class="image-label">Google Street View Ref (' + esc(test.destinationPhotoDate || 'N/A') + ')</div>' +
          '<img src="' + esc(test.destinationPhoto) + '" alt="Reference" /></div>' : '') +
        '</div>';

      var reviewStatus = test.reviewerStatus || 'untested';
      var reviewHtml = '<div class="review-section" data-id="' + esc(idOf(test)) + '">' +
        '<div>' +
          '<label class="small" style="display:block;margin-bottom:4px">Review Status</label>' +
          '<select class="review-select">' +
            '<option value="untested"' + (reviewStatus === 'untested' ? ' selected' : '') + '>Untested</option>' +
            '<option value="pass"' + (reviewStatus === 'pass' ? ' selected' : '') + '>Pass</option>' +
            '<option value="partial"' + (reviewStatus === 'partial' ? ' selected' : '') + '>Partial</option>' +
            '<option value="fail"' + (reviewStatus === 'fail' ? ' selected' : '') + '>Fail</option>' +
          '</select>' +
        '</div>' +
        '<div>' +
          '<label class="small" style="display:block;margin-bottom:4px">Tester Notes</label>' +
          '<textarea class="review-notes" placeholder="What did the participant experience?">' + esc(test.reviewerNotes || '') + '</textarea>' +
        '</div>' +
        '<div style="align-self:end"><button class="primary save-review-btn">Save Notes</button></div>' +
      '</div>';

      var displayMode = test.navigationMode === 'approach' ? 'Mode A (Navigation)' : 'Mode B (Fine Localization)';
      var confidenceText = test.confidenceLevel 
        ? esc(test.confidenceLevel.toUpperCase()) + ' (' + Math.round((test.confidenceScore || 0) * 100) + '%)' 
        : '—';

      var metaHtml = '<div class="test-meta">' +
        '<div><b>Mode:</b> ' + esc(displayMode) + '</div>' +
        '<div><b>Scenario:</b> ' + esc(test.testScenario || '—') + '</div>' +
        '<div><b>Distance:</b> ' + (test.destinationDistanceMeters != null ? Math.round(test.destinationDistanceMeters) + ' m' : '—') + '</div>' +
        '<div><b>Bearing:</b> ' + (test.destinationBearing != null ? Math.round(test.destinationBearing) + '°' : '—') + '</div>' +
        '<div><b>Latency:</b> ' + (test.latencyMs != null ? test.latencyMs + ' ms' : '—') + '</div>' +
      '</div>';

      var finalGuidanceHtml = '<div class="module-block" style="border: 2px solid var(--blue); background: rgba(59, 130, 246, 0.05);">' +
        '<div class="module-head"><span>Final Output sent to user</span></div>' +
        '<div class="module-metric" style="font-size: 1rem;">' + esc(test.finalOutput || test.error || '—') + '</div>' +
      '</div>';

      document.getElementById('lmDetailBody').innerHTML = imagesHtml + metaHtml + 
        renderModuleBlock(modules.step0) +
        renderModuleBlock(modules.moduleB) +
        renderModuleBlock(modules.moduleC) +
        renderModuleBlock(modules.moduleD) +
        renderModuleBlock(modules.moduleE) +
        finalGuidanceHtml +
        reviewHtml;

      document.getElementById('lmDetailOverlay').style.display = 'block';
    }

    // --- Table Render ---
    function render(payload) {
      showError('');
      var rows = payload.data || [];
      
      var statusFilter = document.getElementById('statusFilter').value;
      var textFilter = document.getElementById('textFilter').value.toLowerCase().trim();
      
      activeTests = rows.filter(function (row) { 
        var matchStatus = !statusFilter || (row.reviewerStatus || 'untested') === statusFilter;
        var destStr = (row.destinationPlaceName || row.destination || '').toLowerCase();
        var matchText = !textFilter || destStr.indexOf(textFilter) > -1;
        return matchStatus && matchText;
      });

      document.getElementById('status').textContent =
        activeTests.length + ' trial' + (activeTests.length === 1 ? '' : 's') + ' shown - updated ' + new Date().toLocaleTimeString();
      
      var el = document.getElementById('lmTestsList');
      if (!activeTests.length) {
        el.innerHTML = '<tr><td colspan="9" class="empty">No tests match the current filters.</td></tr>';
        return;
      }

      el.innerHTML = activeTests.map(function (t, idx) {
        var modules = buildModules(t);
        var review = t.reviewerStatus || 'untested';
        var reviewCls = ['pass', 'partial', 'fail'].indexOf(review) >= 0 ? review : '';
        
        var modeStr = t.navigationMode === 'approach' ? 'Mode A (Nav)' : (t.navigationMode === 'exact' ? 'Mode B (Localize)' : esc(t.navigationMode));

        return '<tr>' +
          '<td>' + esc(fmtDate(t.serverTs || t.createdAt)) + '</td>' +
          '<td><strong>' + esc(t.destinationPlaceName || t.destination) + '</strong></td>' +
          '<td><span class="small">' + esc(modeStr) + '<br>' + esc(t.testScenario) + '</span></td>' +
          '<td><span class="pill ' + reviewCls + '">' + esc(review) + '</span></td>' +
          '<td>' + badge(modules.moduleB.status) + '</td>' +
          '<td>' + badge(modules.moduleC.status) + '</td>' +
          '<td>' + badge(modules.moduleD.status) + '</td>' +
          '<td>' + badge(modules.moduleE.status) + '</td>' +
          '<td><button class="secondary view-btn" data-idx="' + idx + '">View</button></td>' +
        '</tr>';
      }).join('');
    }

    // --- API Interactions ---
    function load() {
      var baseUrl = window.location.origin;
      document.getElementById('download').href = baseUrl + '/api/last-mile-tests/export.csv' + qs();
      
      fetch(baseUrl + '/api/last-mile-tests' + qs(), { headers: authHeaders() })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(render)
        .catch(function (error) {
          showError('Could not load tests. Check token and logs. ' + error.message);
          document.getElementById('lmTestsList').innerHTML = '<tr><td colspan="9" class="empty">Failed to load data.</td></tr>';
        });
    }

    // --- Event Listeners ---
    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('apply').addEventListener('click', load);
    
    document.getElementById('lmDetailClose').addEventListener('click', function () {
      document.getElementById('lmDetailOverlay').style.display = 'none';
    });
    
    document.getElementById('lmDetailOverlay').addEventListener('click', function (e) {
      if (e.target === this) this.style.display = 'none';
    });

    document.body.addEventListener('click', function (e) {
      if (e.target.classList.contains('view-btn')) {
        openDetail(Number(e.target.getAttribute('data-idx')));
      }
      
      if (e.target.classList.contains('save-review-btn')) {
        var container = e.target.closest('.review-section');
        var id = container.getAttribute('data-id');
        var reviewerStatus = container.querySelector('.review-select').value;
        var reviewerNotes = container.querySelector('.review-notes').value;
        
        e.target.disabled = true;
        e.target.textContent = 'Saving...';
        
        var baseUrl = window.location.origin;
        fetch(baseUrl + '/api/last-mile-tests/' + encodeURIComponent(id) + '/review' + (TOKEN && TOKEN !== '__ADMIN_TOKEN__' ? '?token=' + encodeURIComponent(TOKEN) : ''), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ reviewerStatus: reviewerStatus, reviewerNotes: reviewerNotes })
        })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function() {
          e.target.textContent = 'Saved!';
          setTimeout(function() { e.target.textContent = 'Save Notes'; e.target.disabled = false; }, 2000);
          load();
        })
        .catch(function (error) {
          alert('Could not save review: ' + error.message);
          e.target.disabled = false;
          e.target.textContent = 'Save Notes';
        });
      }
    });

    load();
  </script>
</body>
</html>
