<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Buddy Walk - Last Meters Tests</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #171a1f;
      --panel-2: #20242b;
      --line: #313844;
      --text: #f5f7fb;
      --muted: #a9b1be;
      --quiet: #737d8c;
      --blue: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: #171a1f;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.2rem; }
    button, a.button, select, input, textarea {
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }
    button, a.button {
      cursor: pointer;
      padding: 8px 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
    }
    button.primary, a.button.primary { background: var(--blue); border-color: var(--blue); }
    main { max-width: 1440px; margin: 0 auto; padding: 22px; }
    .toolbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .field label { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 4px; }
    .field input, .field select { height: 36px; padding: 0 10px; }
    .status { margin: 12px 0 18px; color: var(--muted); font-size: 0.9rem; }
    .error {
      display: none;
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--red);
      background: #3a1618;
      border-radius: 6px;
    }
    .empty {
      padding: 28px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      color: var(--muted);
    }
    .trial {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .trial-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #1b1f25;
    }
    .title { font-size: 1rem; font-weight: 800; margin-bottom: 5px; }
    .meta { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #2a3039;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill.pass { color: #dcfce7; background: #14532d; }
    .pill.partial { color: #fef3c7; background: #713f12; }
    .pill.fail { color: #fee2e2; background: #7f1d1d; }
    .body {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }
    .images { display: grid; gap: 14px; align-content: start; }
    .image-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0b0d10; }
    .image-label { padding: 8px 10px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); font-size: 0.82rem; }
    img { display: block; width: 100%; max-height: 380px; object-fit: contain; background: #0b0d10; }
    .panorama img { max-height: 300px; }
    .steps { display: grid; gap: 12px; }
    .step {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: #13161a;
    }
    .step h3 { margin: 0 0 8px; font-size: 0.92rem; }
    .step p { margin: 6px 0 0; line-height: 1.45; }
    .prompt { color: var(--quiet); font-size: 0.82rem; }
    .response { color: var(--text); }
    .final {
      border-left: 4px solid var(--blue);
      padding: 12px;
      background: #111827;
      border-radius: 6px;
      line-height: 1.5;
    }
    .review {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .review select { width: 100%; height: 38px; padding: 0 8px; }
    .review textarea {
      width: 100%;
      min-height: 74px;
      padding: 8px 10px;
      resize: vertical;
      line-height: 1.35;
    }
    .small { color: var(--quiet); font-size: 0.78rem; }
    @media (max-width: 980px) {
      header { position: static; }
      .trial-head, .body, .review { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Buddy Walk - Last Meters Tests</h1>
      <div class="small">Review field trials, compare photos, and save tester notes.</div>
    </div>
    <div class="toolbar">
      <button id="refresh">Refresh</button>
      <a class="button primary" id="download" href="#">CSV</a>
      <a class="button" id="analytics" href="#">Analytics</a>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <div class="field">
        <label for="limit">Limit</label>
        <input id="limit" type="number" min="1" max="500" value="25" />
      </div>
      <div class="field">
        <label for="since">Since</label>
        <input id="since" type="date" />
      </div>
      <div class="field">
        <label for="until">Until</label>
        <input id="until" type="date" />
      </div>
      <div class="field">
        <label for="statusFilter">Review</label>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="untested">Untested</option>
          <option value="pass">Pass</option>
          <option value="partial">Partial</option>
          <option value="fail">Fail</option>
        </select>
      </div>
      <button class="primary" id="apply">Apply</button>
    </div>
    <div class="status" id="status">Loading...</div>
    <div class="error" id="error"></div>
    <div id="trials"></div>
  </main>

  <script>
    var TOKEN = '__ADMIN_TOKEN__';

    function qs() {
      var params = new URLSearchParams();
      if (TOKEN) params.set('token', TOKEN);
      params.set('includeImages', 'true');
      params.set('limit', document.getElementById('limit').value || '25');
      var since = document.getElementById('since').value;
      var until = document.getElementById('until').value;
      if (since) params.set('since', since);
      if (until) params.set('until', until);
      return '?' + params.toString();
    }

    function authHeaders(extra) {
      var headers = extra || {};
      if (TOKEN) headers['x-admin-token'] = TOKEN;
      return headers;
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function idOf(row) {
      return row._id || row.id || '';
    }

    function fmtDate(value) {
      if (!value) return '';
      var date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
    }

    function showError(message) {
      var el = document.getElementById('error');
      el.style.display = message ? 'block' : 'none';
      el.textContent = message || '';
    }

    function statusClass(status) {
      return ['pass', 'partial', 'fail'].indexOf(status) >= 0 ? status : '';
    }

    function stepHtml(step, index) {
      var heading = step.parsedHeading == null ? '' : ' - parsed ' + step.parsedHeading + ' deg';
      var ok = step.success ? 'success' : 'failed';
      return '<div class="step">' +
        '<h3>Step ' + (index + 1) + ': ' + esc(step.name || 'AI call') + heading + '</h3>' +
        '<div class="small">' + esc(step.model || '') + ' - ' + esc(ok) +
        (step.tokenCount ? ' - ' + esc(step.tokenCount) + ' tokens' : '') + '</div>' +
        '<p class="prompt">' + esc(step.prompt || '') + '</p>' +
        '<p class="response">' + esc(step.response || step.error || '') + '</p>' +
      '</div>';
    }

    function trialHtml(row) {
      var id = idOf(row);
      var review = row.reviewerStatus || 'untested';
      var steps = (row.steps || []).map(stepHtml).join('');
      var coords = [row.lat, row.lng].filter(function (v) { return v !== undefined; }).join(', ');
      var success = row.success ? 'AI success' : 'AI failed';
      return '<article class="trial" data-id="' + esc(id) + '">' +
        '<div class="trial-head">' +
          '<div><div class="title">' + esc(row.destination || 'Unknown destination') + '</div>' +
          '<div class="meta">' + esc(fmtDate(row.serverTs)) + ' - ' + esc(coords) +
          '<br>Panorama capture: ' + esc(row.panoramaDate || 'Date unavailable') +
          ' | Street View: ' + esc(row.panoramaStatus || 'Unknown') +
          '<br>Destination reference: ' + esc(row.destinationReferenceUsed ? 'Used' : 'Not used') +
          (row.destinationPlaceName ? ' | ' + esc(row.destinationPlaceName) : '') +
          '<br>Navigation mode: ' + esc(row.navigationMode || 'Unknown') +
          ' | Destination distance: ' + esc(row.destinationDistanceMeters == null ? '' : Math.round(row.destinationDistanceMeters) + ' m') +
          '<br>Phone heading: ' + esc(row.deviceHeading == null ? '' : Math.round(row.deviceHeading) + ' deg') +
          ' | Destination bearing: ' + esc(row.destinationBearing == null ? '' : Math.round(row.destinationBearing) + ' deg') +
          ' | Difference: ' + esc(row.headingDifferenceDegrees == null ? '' : Math.round(row.headingDifferenceDegrees) + ' deg') +
          '<br>Current heading: ' + esc(row.currentHeading ?? '') +
          ' | Target heading: ' + esc(row.targetHeading ?? '') +
          ' | Latency: ' + esc(row.latencyMs ?? '') + ' ms</div></div>' +
          '<div><span class="pill ' + statusClass(review) + '">' + esc(review) + '</span> <span class="pill">' + esc(success) + '</span></div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="images">' +
            '<div class="image-wrap"><div class="image-label">User photo</div>' +
            (row.userPhoto ? '<img src="' + esc(row.userPhoto) + '" alt="User-submitted Last Meters photo" />' : '<div class="empty">No user photo saved.</div>') +
            '</div>' +
            '<div class="image-wrap panorama"><div class="image-label">Panorama composite' +
            (row.panoramaDate ? ' - captured ' + esc(row.panoramaDate) : '') + '</div>' +
            (row.panoramaPhoto ? '<img src="' + esc(row.panoramaPhoto) + '" alt="Street View panorama composite" />' : '<div class="empty">No panorama saved.</div>') +
            '</div>' +
            (row.destinationPhoto ? '<div class="image-wrap"><div class="image-label">Destination-focused Street View' +
            (row.destinationPhotoDate ? ' - captured ' + esc(row.destinationPhotoDate) : '') + '</div>' +
            '<img src="' + esc(row.destinationPhoto) + '" alt="Street View image focused on the verified destination" />' +
            '<div class="small">' + esc(row.destinationPlaceAddress || row.destinationPlaceName || '') + '</div></div>' : '') +
          '</div>' +
          '<div class="steps">' +
            '<div class="final"><strong>Final guidance:</strong><br>' + esc(row.finalOutput || row.error || '') + '</div>' +
            steps +
            '<div class="review">' +
              '<select aria-label="Review status">' +
                '<option value="untested"' + (review === 'untested' ? ' selected' : '') + '>Untested</option>' +
                '<option value="pass"' + (review === 'pass' ? ' selected' : '') + '>Pass</option>' +
                '<option value="partial"' + (review === 'partial' ? ' selected' : '') + '>Partial</option>' +
                '<option value="fail"' + (review === 'fail' ? ' selected' : '') + '>Fail</option>' +
              '</select>' +
              '<textarea aria-label="Tester notes" placeholder="Tester notes: what did the participant experience?">' + esc(row.reviewerNotes || '') + '</textarea>' +
              '<button class="primary save-review">Save</button>' +
            '</div>' +
            '<div class="small">' + (row.reviewedAt ? 'Reviewed ' + esc(fmtDate(row.reviewedAt)) : 'No review saved yet.') + '</div>' +
          '</div>' +
        '</div>' +
      '</article>';
    }

    function setExportLink() {
      document.getElementById('download').href = '/api/last-mile-tests/export.csv' + qs();
      document.getElementById('analytics').href = '/usage' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
    }

    function render(payload) {
      showError('');
      var rows = payload.data || [];
      var filter = document.getElementById('statusFilter').value;
      if (filter) {
        rows = rows.filter(function (row) { return (row.reviewerStatus || 'untested') === filter; });
      }
      document.getElementById('status').textContent =
        rows.length + ' trial' + (rows.length === 1 ? '' : 's') + ' shown - source: ' + (payload.source || 'unknown') +
        ' - updated ' + new Date().toLocaleTimeString();
      document.getElementById('trials').innerHTML = rows.length
        ? rows.map(trialHtml).join('')
        : '<div class="empty">No Last Meters trials yet. Run Last Meters in the app, then refresh this page.</div>';
    }

    function load() {
      setExportLink();
      fetch('/api/last-mile-tests' + qs(), { headers: authHeaders() })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(render)
        .catch(function (error) {
          showError('Could not load Last Meters tests. Check the admin token and server logs. ' + error.message);
        });
    }

    document.getElementById('trials').addEventListener('click', function (event) {
      if (!event.target.classList.contains('save-review')) return;
      var article = event.target.closest('.trial');
      var id = article && article.getAttribute('data-id');
      if (!id) {
        showError('This row cannot be reviewed because it has no database id.');
        return;
      }
      var reviewerStatus = article.querySelector('select').value;
      var reviewerNotes = article.querySelector('textarea').value;
      event.target.disabled = true;
      event.target.textContent = 'Saving';
      fetch('/api/last-mile-tests/' + encodeURIComponent(id) + '/review' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : ''), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ reviewerStatus: reviewerStatus, reviewerNotes: reviewerNotes })
      })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(load)
        .catch(function (error) { showError('Could not save review. ' + error.message); })
        .finally(function () {
          event.target.disabled = false;
          event.target.textContent = 'Save';
        });
    });

    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('apply').addEventListener('click', load);
    document.getElementById('statusFilter').addEventListener('change', load);
    load();
  </script>
</body>
</html>
