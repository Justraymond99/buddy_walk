# Render Blueprint — Buddy Walk API (zero-config).
#
# Deploy: https://dashboard.render.com → New → Blueprint → select this repo.
# Public URL: https://buddy-walk-api.onrender.com
#
# OpenAI and Google Maps keys are read from the service environment.
# Render auto-generates ADMIN_TOKEN.
# After deploy, open:
#   https://buddy-walk-api.onrender.com/usage?token=YOUR_ADMIN_TOKEN
#
# If API keys are missing, AI / speech / MTA requests are proxied to
# buddywalk.app in the background. Telemetry, feedback, chat logs, thumbs, and
# companion data stay on YOUR server.
services:
  - type: web
    name: buddy-walk-api
    runtime: docker
    plan: free
    rootDir: mobile
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: ALLOWED_ORIGINS
        value: https://buddy-walk-api.onrender.com,https://justraymond99.github.io
      - key: ADMIN_TOKEN
        generateValue: true
      - key: UPSTREAM_API_ROOT
        value: https://buddywalk.app
